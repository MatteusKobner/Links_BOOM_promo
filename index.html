<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Boom Promo — Achadinhos e Ofertas</title>
  <meta name="description" content="Achadinhos, ofertas e produtos úteis selecionados pela Boom Promo." />
  <meta property="og:title" content="Boom Promo — Achadinhos e Ofertas" />
  <meta property="og:description" content="Todos os produtos da Boom Promo em um só lugar." />
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <img class="brand-logo" src="/assets/logo.png" alt="Boom Promo" />
      <h1>Boom Promo</h1>
      <p>Achadinhos úteis, ofertas e produtos que chamaram nossa atenção.</p>

      <nav class="socials" aria-label="Redes sociais">
        <span class="social-pill">YouTube</span>
        <span class="social-pill">Instagram</span>
        <span class="social-pill">TikTok</span>
      </nav>
    </header>

    <section class="section-heading">
      <div>
        <span class="kicker">🔥 Em destaque</span>
        <h2>Produtos</h2>
      </div>
      <span id="product-count" class="count"></span>
    </section>

    <section id="products" class="product-list" aria-live="polite"></section>

    <footer>
      <strong>Boom Promo</strong>
      <p>Os preços podem mudar a qualquer momento na loja parceira.</p>
      <p>Alguns links podem ser de afiliado. Você não paga nada a mais por isso.</p>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
